<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Bottlenose</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a full-bleed ASCII sea on top, the scene's own source scrolling beneath it */
:root {
  --sea: #04111c;
  --panel: #07101a;
  --ink: #d3dde8;
  --dim: #6a7f95;
  --faint: #304256;
  --rule: #132233;
  --comment: #86a892;
  --num: #e6ac72;
  --kw: #9ec4ff;
  --focus: #8fd6e8;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--sea); color: var(--ink); font-family: var(--mono); overflow: hidden; }
.app { height: 100%; display: flex; flex-direction: column; }
.stage { position: relative; flex: 1 1 66%; min-height: 0; touch-action: none; cursor: grab; outline: none; }
.stage:active { cursor: grabbing; }
.stage:focus-visible { box-shadow: inset 0 0 0 1px var(--faint); }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud, .hint {
  position: absolute; left: 0; right: 0; display: flex; gap: 1.4em; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap;
  text-shadow: 0 0 6px var(--sea);
}
.hud { top: 12px; flex-wrap: wrap; row-gap: 4px; }
.hud b { color: var(--ink); font-weight: 400; }
.hud .tag { margin-left: auto; }
.hint { bottom: 8px; font-size: 11px; }
.panel { flex: 0 0 34%; display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-top: 1px solid var(--rule); }
.controls {
  display: flex; align-items: center; gap: 8px; padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.chips { display: flex; gap: 6px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip, .tool {
  font: inherit; font-size: 11px; background: none; color: var(--dim); border: 1px solid var(--rule);
  padding: 3px 9px; border-radius: 3px; white-space: nowrap; cursor: pointer;
}
.chip:hover, .tool:hover { color: var(--ink); }
.chip.on { color: var(--ink); border-color: var(--faint); }
.chip:focus-visible, .tool:focus-visible { outline: 1px solid var(--focus); outline-offset: 1px; }
.float { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 6px; background: var(--panel); }
.code {
  position: relative; flex: 1; min-height: 0; overflow: auto; font-size: 11.5px; line-height: 1.6;
  padding-block: 2px 24px; padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.ln { display: flex; white-space: pre; opacity: .38; transition: opacity .5s; }
.ln.on { opacity: 1; }
.no { flex: 0 0 4.2em; text-align: right; padding-right: 1.3em; color: var(--faint); user-select: none; }
.c { color: var(--comment); }
.k { color: var(--kw); }
.n { color: var(--num); }
.progress { height: 2px; background: var(--rule); flex: none; }
.progress i { display: block; height: 100%; width: 0; background: var(--dim); }
@media (min-width: 900px) { .panel { flex-basis: 30%; } .code { font-size: 12px; } }
</style>

<div class="app">
  <div class="stage" id="stage" tabindex="0" aria-label="Animated ASCII bottlenose dolphin swimming laps near a reef and leaping through the surface. Drag or use arrow keys to orbit, tap or press space to make it blow bubbles.">
    <canvas id="view"></canvas>
    <div class="hud" aria-hidden="true">
      <span>speed <b id="spd">0.0</b> m/s</span>
      <span>fluke <b id="hz">0.0</b> Hz</span>
      <span>depth <b id="dep">0.0</b></span>
      <span>chars <b id="chars">0</b></span>
      <span class="tag">tursiops · 01</span>
    </div>
    <div class="hint" aria-hidden="true">drag to orbit · tap for bubbles</div>
    <button class="tool float" id="showSrc" type="button" hidden>Show source</button>
  </div>
  <div class="panel" id="panel">
    <div class="progress"><i id="bar"></i></div>
    <div class="controls">
      <div class="chips" id="chips" role="tablist" aria-label="Source sections"></div>
      <button class="tool" id="pause" type="button">Pause</button>
      <button class="tool" id="hideSrc" type="button">Hide source</button>
    </div>
    <div class="code" id="code"></div>
  </div>
</div>

<script id="scene">
// [setup]
// Everything solid becomes points: the dolphin, rocks, grass, fish and
// bubbles. Points are projected onto a grid of character cells and each
// cell keeps the nearest one. The seabed and the underside of the surface
// are not points: every cell casts a ray and shades whichever plane it hits,
// so there are never holes and never wasted points.
const TAU = Math.PI * 2, SURF = 1.25, FLOOR = -1.65, METRES = 1.25;
const MONO = '"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = document.getElementById('stage');
const view = document.getElementById('view'), vctx = view.getContext('2d');
const txt = document.createElement('canvas'), tctx = txt.getContext('2d');
const bloom = document.createElement('canvas'), bctx = bloom.getContext('2d');
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function rng(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

}
let TIME = 0, paused = false;
// sunlight comes from above, a little from the right and from the viewer
const _l = Math.hypot(0.25, 1, 0.3), LX = 0.25 / _l, LY = 1 / _l, LZ = 0.3 / _l;

// [grid]
// Cells are measured in device pixels and rounded, so every glyph lands on
// a whole pixel: no half-pixel smearing. Per cell: distance, brightness,
// material, an explicit glyph (0 = from the ramp), how much may show through
// it, what kind of thing it is, and its surface normal on screen.
let W = 1, H = 1, DPR = 1, FONT = 12, CW = 7, CH = 15, COLS = 1, ROWS = 1, OX = 0, OY = 0;
let depth, lum, mat, chr, glass, kind, nsx, nsy, bucket, order;
const SOLID = 1, LINE = 2, GROUND = 3, CEIL = 4, MOTE = 5, EDGE = 6;
let SNX = 0, SNY = 0;
function resize() {
  const r = stage.getBoundingClientRect();
  W = Math.max(1, r.width); H = Math.max(1, r.height); DPR = Math.min(2, window.devicePixelRatio || 1);
  view.width = txt.width = Math.round(W * DPR); view.height = txt.height = Math.round(H * DPR);
  bloom.width = Math.max(1, Math.round(W / 4)); bloom.height = Math.max(1, Math.round(H / 4));
  FONT = W < 560 ? 9 : W < 1100 ? 11 : 12;
  tctx.font = Math.round(FONT * DPR) + 'px ' + MONO;
  CW = Math.max(2, Math.round(tctx.measureText('M').width)); CH = Math.round(FONT * DPR * 1.25);
  COLS = Math.max(1, Math.floor(view.width / CW)); ROWS = Math.max(1, Math.floor(view.height / CH));
  OX = Math.floor((view.width - COLS * CW) / 2); OY = Math.floor((view.height - ROWS * CH) / 2);
  const n = COLS * ROWS;
  depth = new Float32Array(n); lum = new Float32Array(n); glass = new Float32Array(n);
  nsx = new Float32Array(n); nsy = new Float32Array(n);
  mat = new Uint8Array(n); chr = new Uint8Array(n); kind = new Uint8Array(n);
  bucket = new Int16Array(n); order = new Int32Array(n);
}

// [camera]
// Side-on, like watching from a reef wall. It eases after the dolphin
// (never snaps), rises to follow a leap and sways slowly. It frames the
// dolphin tightly, about two metres of water above and below it.
const cam = { dist: 4.3, yaw: 0, pitch: -0.05, dyaw: 0, dpitch: 0, tx: 0, ty: 0, tz: 0 };
let CX = 0, CY = 0, CZ = 0, RX = 1, RZ = 0, UX = 0, UY = 1, UZ = 0, FX = 0, FY = 0, FZ = -1, FOC = 30, ASP = 0.5;
function setCamera(dt) {
  const k = 1 - Math.exp(-dt * 1.4);
  cam.tx += (D.cx - cam.tx) * k;
  cam.ty += (clamp(D.cy * 0.85, FLOOR + 0.75, SURF + 0.3) - cam.ty) * k;
  cam.tz += (D.cz * 0.5 - cam.tz) * k;
  const yaw = cam.yaw + cam.dyaw + (REDUCED ? 0 : 0.16 * Math.sin(TIME * 0.05));
  const pitch = clamp(cam.pitch + cam.dpitch, -0.4, 0.6);
  CX = cam.tx + cam.dist * Math.cos(pitch) * Math.sin(yaw);
  CY = Math.min(SURF - 0.12, Math.max(FLOOR + 0.15, cam.ty + cam.dist * Math.sin(pitch)));
  CZ = cam.tz + cam.dist * Math.cos(pitch) * Math.cos(yaw);
  FX = cam.tx - CX; FY = cam.ty - CY; FZ = cam.tz - CZ;
  const f = Math.hypot(FX, FY, FZ); FX /= f; FY /= f; FZ /= f;
  const r = Math.hypot(FZ, FX); RX = -FZ / r; RZ = FX / r;   // right = forward x up
  UX = -RZ * FY; UY = RZ * FX - RX * FZ; UZ = RX * FY;      // up = right x forward
  ASP = CW / CH;
  FOC = Math.min((ROWS / 2) * cam.dist / (1.1 * ASP), (COLS / 2) * cam.dist / 1.25);
}

// [projection]
let PX = 0, PY = 0, PZ = 0;
function project(x, y, z) {
  const dx = x - CX, dy = y - CY, dz = z - CZ;
  PZ = dx * FX + dy * FY + dz * FZ;
  if (PZ < 0.2) return false;
  PX = COLS * 0.5 + (dx * RX + dz * RZ) / PZ * FOC;
  PY = ROWS * 0.5 - (dx * UX + dy * UY + dz * UZ) / PZ * FOC * ASP;
  return true;
}
// A point wins its cell if it is nearer, or if it asks to be seen through
// (see) and the cell holds glass at most that far in front of it.
function put(px, py, pz, L, m, ch, see, gl, k) {
  if (px < 0 || py < 0 || px >= COLS || py >= ROWS) return;
  const i = (py | 0) * COLS + (px | 0), d = depth[i];
  if (!(pz < d || pz < d + Math.min(see, glass[i]))) return;
  depth[i] = pz < d ? pz : d; lum[i] = L; mat[i] = m; chr[i] = ch; glass[i] = gl; kind[i] = k;
  nsx[i] = SNX; nsy[i] = SNY;
}
function plot(x, y, z, L, m, ch, see, gl, k) { if (project(x, y, z)) put(PX, PY, PZ, L, m, ch, see, gl, k); }
// Light and specks only ever land on open water: they never cover an animal.
function putBg(px, py, pz, L, m, ch) {
  if (px < 0 || py < 0 || px >= COLS || py >= ROWS) return;
  const i = (py | 0) * COLS + (px | 0);
  if ((kind[i] !== GROUND && kind[i] !== CEIL) || pz >= depth[i]) return;
  depth[i] = pz; lum[i] = L; mat[i] = m; chr[i] = ch; kind[i] = MOTE;
}
function slope(vx, vy) {            // a screen direction (y down) -> | / \ -
  if (vx < 0) { vx = -vx; vy = -vy; }
  const a = Math.atan2(vy, vx);
  return a > 1.18 || a < -1.18 ? 124 : a > 0.39 ? 92 : a < -0.39 ? 47 : 45;
}
function line(ax, ay, az, bx, by, bz, L, m, see) {
  if (!project(ax, ay, az)) return;
  const x0 = PX, y0 = PY, z0 = PZ;
  if (!project(bx, by, bz)) return;
  const x1 = PX, y1 = PY, z1 = PZ, ch = slope((x1 - x0) * CW, (y1 - y0) * CH);
  const n = Math.min(120, Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) * 1.5) + 1);
  for (let s = 0; s <= n; s++) {
    const t = s / n;
    put(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, z0 + (z1 - z0) * t, L, m, ch, see, 0, LINE);
  }
}
function fresnel(x, y, z, nx, ny, nz) {
  const vx = CX - x, vy = CY - y, vz = CZ - z;
  return 1 - Math.abs(nx * vx + ny * vy + nz * vz) / Math.hypot(vx, vy, vz);
}

// [path]
// The dolphin's lap: a closed Catmull-Rom curve through these marks,
// resampled by arc length so speed means speed. The fifth mark is above
// the surface: that is the leap.
const ROUTE = [[-4.6, -0.55, 0.7], [-2.2, -1.0, 0.95], [0.4, -0.75, 0.55], [2.1, 0.25, 0.25],
               [3.35, 2.05, 0.05], [4.55, 0.25, -0.3], [5.1, -0.95, -1.4], [3.6, -1.2, -2.5],
               [0.6, -0.6, -2.7], [-2.4, 0.15, -2.4], [-4.7, -0.25, -1.6], [-5.7, -0.6, -0.3]];
const PN = 1440, PATH = new Float32Array(PN * 3), PL = new Float32Array(PN + 1);
{
  const n = ROUTE.length, per = PN / n;
  for (let k = 0; k < PN; k++) {
    const seg = Math.floor(k / per), t = k / per - seg, t2 = t * t, t3 = t2 * t;
    const p0 = ROUTE[(seg - 1 + n) % n], p1 = ROUTE[seg], p2 = ROUTE[(seg + 1) % n], p3 = ROUTE[(seg + 2) % n];
    for (let c = 0; c < 3; c++) {
      PATH[k * 3 + c] = 0.5 * (2 * p1[c] + (p2[c] - p0[c]) * t + (2 * p0[c] - 5 * p1[c] + 4 * p2[c] - p3[c]) * t2 +
                               (3 * p1[c] - p0[c] - 3 * p2[c] + p3[c]) * t3);
    }
  }
  for (let k = 1; k <= PN; k++) {
    const a = (k - 1) * 3, b = (k % PN) * 3;
    PL[k] = PL[k - 1] + Math.hypot(PATH[b] - PATH[a], PATH[b + 1] - PATH[a + 1], PATH[b + 2] - PATH[a + 2]);
  }
}
const LAP = PL[PN];
let QX = 0, QY = 0, QZ = 0;
function pathAt(d) {
  d = ((d % LAP) + LAP) % LAP;
  let lo = 0, hi = PN;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (PL[m] <= d) lo = m; else hi = m; }
  const f = (d - PL[lo]) / (PL[hi] - PL[lo] || 1), a = lo * 3, b = (hi % PN) * 3;
  QX = PATH[a] + (PATH[b] - PATH[a]) * f; QY = PATH[a + 1] + (PATH[b + 1] - PATH[a + 1]) * f; QZ = PATH[a + 2] + (PATH[b + 2] - PATH[a + 2]) * f;
}

// [swimmer]
// The head runs along the lap and the body is the lap itself, sampled
// behind the head, so it bends exactly where the head has turned. On top of
// that a wave runs from mid-body to the flukes: dolphins swim up and down,
// not side to side. It banks into turns, speeds up for the leap and stops
// beating its flukes while it is in the air.
const BODY = 2.0, SP = 72;
const BP = new Float32Array(SP * 3), BU = new Float32Array(SP * 3);   // path points, their up
const SPn = new Float32Array(SP * 3), ST = new Float32Array(SP * 3), SU = new Float32Array(SP * 3), SS = new Float32Array(SP * 3);
const D = { d: 0, speed: 1.6, phase: 0, freq: 1, amp: 1, roll: 0, cx: 0, cy: 0, cz: 0, kx: 1, kz: 0, headY: -1, tailY: -1, exhale: 0 };
function swim(dt) {
  pathAt(D.d);
  const want = 1.45 + 1.05 * Math.exp(-((QX - 2.6) ** 2) / 1.3 - (QZ * QZ) / 0.8);
  D.speed += (want - D.speed) * Math.min(1, dt * 1.2);
  D.d = (D.d + D.speed * dt) % LAP;
  D.freq = 0.3 + 0.5 * D.speed;
  D.phase += D.freq * TAU * dt;
  for (let i = 0; i < SP; i++) {
    pathAt(D.d - i / (SP - 1) * BODY);
    BP[i * 3] = QX; BP[i * 3 + 1] = QY; BP[i * 3 + 2] = QZ;
  }
  // bank: compare the heading at the snout with the heading mid-body
  const ax = BP[0] - BP[24], az = BP[2] - BP[26], bx = BP[48] - BP[72], bz = BP[50] - BP[74];
  const turn = (ax * bz - az * bx) / (Math.hypot(ax, az) * Math.hypot(bx, bz) + 1e-6);
  D.roll += (clamp(turn * 3.5, -0.7, 0.7) - D.roll) * Math.min(1, dt * 2);
  const air = BP[(SP >> 1) * 3 + 1] > SURF;
  D.amp += ((air ? 0.1 : 1) - D.amp) * Math.min(1, dt * 4);
  const cr = Math.cos(D.roll), sr = Math.sin(D.roll);

    let tx = BP[a] - BP[b], ty = BP[a + 1] - BP[b + 1], tz = BP[a + 2] - BP[b + 2];
    const tl = Math.hypot(tx, ty, tz) || 1; tx /= tl; ty /= tl; tz /= tl;
    let ux = -tx * ty, uy = 1 - ty * ty, uz = -tz * ty;              // world up, made square to the body
    const ul = Math.hypot(ux, uy, uz) || 1; ux /= ul; uy /= ul; uz /= ul;

    let tx = SPn[a] - SPn[b], ty = SPn[a + 1] - SPn[b + 1], tz = SPn[a + 2] - SPn[b + 2];
    const tl = Math.hypot(tx, ty, tz) || 1; tx /= tl; ty /= tl; tz /= tl;
    const dp = BU[k] * tx + BU[k + 1] * ty + BU[k + 2] * tz;
    let ux = BU[k] - tx * dp, uy = BU[k + 1] - ty * dp, uz = BU[k + 2] - tz * dp;
    const ul = Math.hypot(ux, uy, uz) || 1; ux /= ul; uy /= ul; uz /= ul;
    ST[k] = tx; ST[k + 1] = ty; ST[k + 2] = tz; SU[k] = ux; SU[k + 1] = uy; SU[k + 2] = uz;

  }

  const hl = Math.hypot(ST[m], ST[m + 2]) || 1; D.kx = ST[m] / hl; D.kz = ST[m + 2] / hl;
  // crossing the surface throws spray and drags air down with it

  if (D.headY > -1 && (D.headY < SURF) !== (hy < SURF)) splash(SPn[0], SPn[2], hy > SURF ? 0.8 : 1.3);
  if (D.tailY > -1 && (D.tailY < SURF) !== (ty < SURF)) splash(SPn[(SP - 1) * 3], SPn[(SP - 1) * 3 + 2], 0.6);
  D.headY = hy; D.tailY = ty;
  if (D.exhale > 0) {
    D.exhale -= dt;
    frameAt(0.17); profile(0.17);
    for (let n = 0; n < 2; n++) emit(FPX + FUX * PRT, FPY + FUY * PRT, FPZ + FUZ * PRT, (Math.random() - 0.5) * 0.2, 0.3, (Math.random() - 0.5) * 0.2, 0.2 + Math.random() * 0.8, 6);
  }
}
let FPX = 0, FPY = 0, FPZ = 0, FTX = 0, FTY = 0, FTZ = 0, FUX = 0, FUY = 0, FUZ = 0, FSX = 0, FSY = 0, FSZ = 0;
function frameAt(s) {
  const f = clamp(s, 0, 1) * (SP - 1), i = Math.min(SP - 2, f | 0), u = f - i, a = i * 3, b = a + 3;
  FPX = SPn[a] + (SPn[b] - SPn[a]) * u; FPY = SPn[a + 1] + (SPn[b + 1] - SPn[a + 1]) * u; FPZ = SPn[a + 2] + (SPn[b + 2] - SPn[a + 2]) * u;
  FTX = ST[a] + (ST[b] - ST[a]) * u; FTY = ST[a + 1] + (ST[b + 1] - ST[a + 1]) * u; FTZ = ST[a + 2] + (ST[b + 2] - ST[a + 2]) * u;
  FUX = SU[a] + (SU[b] - SU[a]) * u; FUY = SU[a + 1] + (SU[b + 1] - SU[a + 1]) * u; FUZ = SU[a + 2] + (SU[b + 2] - SU[a + 2]) * u;

}

// [body]
// A bottlenose in cross-sections: s runs from the tip of the beak (0) to the
// tail stock (1). Top and bottom differ: the melon rises steeply behind the
// short beak, the belly is fuller than the back is tall, and the tail stock
// is a narrow keel. Heights and widths are fractions of a 2-unit body.
const PS = [0, .02, .05, .08, .10, .12, .15, .20, .27, .35, .45, .55, .65, .75, .85, .93, 1];

function drawDolphin() {
  if (!project(D.cx, D.cy, D.cz)) return;
  const ppu = FOC / PZ;                                     // cells per unit at the dolphin
  const nS = clamp(Math.ceil(BODY * ppu * 2), 60, 700), nT = clamp(Math.ceil(TAU * 0.17 * ppu * 2.2), 24, 260);
  for (let a = 0; a <= nS; a++) {
    const s = a / nS;

    profile(s); frameAt(s);
    const dT = (t2 - PRT) / (0.004 * BODY), dB = (b2 - PRB) / (0.004 * BODY), dW = (w2 - PRW) / (0.004 * BODY);
    const cape = s < 0.1 ? 0.2 : 0.3 + 0.28 * smooth(0.18, 0.45, s) - 0.34 * smooth(0.55, 0.85, s);

      let nx = FUX * nu + FSX * ns + FTX * na, ny = FUY * nu + FSY * ns + FTY * na, nz = FUZ * nu + FSZ * ns + FTZ * na;
      const nl = Math.hypot(nx, ny, nz) || 1; nx /= nl; ny /= nl; nz /= nl;

      const L = 0.1 + 0.62 * Math.max(0, nx * LX + ny * LY + nz * LZ) + 0.12 * Math.max(0, -ny) + 0.16 * f * f;

    const v = PRT * 0.28, w = PRW * 0.97 * sg;
    plot(FPX + FUX * v + FSX * w, FPY + FUY * v + FSY * w, FPZ + FUZ * v + FSZ * w, 0.5, 4, 64, 0.05, 0, LINE);
  }

      let px = 0, py = 0, pz = 0;
      for (let i = 0; i <= 8; i++) {

        const v = PRB * (-0.2 + 0.55 * smooth(0.07, 0.105, s)), w = PRW * 0.96 * sg;
        const x = FPX + FUX * v + FSX * w, y = FPY + FUY * v + FSY * w, z = FPZ + FUZ * v + FSZ * w;

}

// [fins]
// Three thin sheets: a falcate dorsal fin (straight leading edge, hooked
// trailing edge), two pectoral flippers that paddle a little as it swims,
// and the flukes, swept back with a notch in the middle. They pitch with
// the tail because they hang off the same undulating frame.
function drawFins(ppu) {
  const lit = (nx, ny, nz) => Math.abs(nx * LX + ny * LY + nz * LZ);
  let nv = Math.ceil(0.25 * ppu * 1.6) + 3, na = Math.ceil(0.22 * ppu * 1.6) + 3;
  for (let i = 0; i <= nv; i++) {
    const v = i / nv, sf = 0.40 + 0.215 * v ** 1.35, sb = 0.565 + 0.05 * v ** 2.6;
    for (let j = 0; j <= na; j++) {
      const s = sf + (sb - sf) * j / na; frameAt(s); profile(s);
      const h = PRT * 0.92 + v * 0.25;
      plot(FPX + FUX * h, FPY + FUY * h, FPZ + FUZ * h, 0.16 + 0.4 * lit(FSX, FSY, FSZ) + 0.12 * v, 1, 0, 6, 0.04, SOLID);
    }
  }

  for (const sg of [-1, 1]) {
    const beat = 0.12 * Math.sin(D.phase * 0.5 + (sg > 0 ? 0 : 1.2));
    let dx = -T[0] * 0.72 - U[0] * (0.48 + beat) + S[0] * sg * 0.5, dy = -T[1] * 0.72 - U[1] * (0.48 + beat) + S[1] * sg * 0.5, dz = -T[2] * 0.72 - U[2] * (0.48 + beat) + S[2] * sg * 0.5;
    const dl = Math.hypot(dx, dy, dz); dx /= dl; dy /= dl; dz /= dl;
    const dp = T[0] * dx + T[1] * dy + T[2] * dz;
    let cx = T[0] - dx * dp, cy = T[1] - dy * dp, cz = T[2] - dz * dp;
    const cl = Math.hypot(cx, cy, cz) || 1; cx /= cl; cy /= cl; cz /= cl;
    const L = 0.2 + 0.45 * lit(dy * cz - dz * cy, dz * cx - dx * cz, dx * cy - dy * cx);
    const ox = root[0] - U[0] * rb * 0.55 + S[0] * sg * rw * 0.75, oy = root[1] - U[1] * rb * 0.55 + S[1] * sg * rw * 0.75, oz = root[2] - U[2] * rb * 0.55 + S[2] * sg * rw * 0.75;
    for (let i = 0; i <= nv; i++) {
      const v = i / nv, len = 0.3 * v, chd = 0.11 * Math.sqrt(Math.max(0, 1 - v * v)) * (1 - 0.3 * v) + 0.008;
      for (let j = 0; j <= na; j++) {
        const off = (j / na - 0.35) * chd;
        plot(ox + dx * len + cx * off, oy + dy * len + cy * off, oz + dz * len + cz * off, L, 2, 0, 6, 0.04, SOLID);
      }
    }
  }

  nv = Math.ceil(0.31 * ppu * 1.6) + 3; na = Math.ceil(0.17 * ppu * 1.8) + 3;
  for (const sg of [-1, 1]) {
    for (let i = 0; i <= nv; i++) {
      const v = i / nv, lead = 0.02 + 0.13 * v ** 1.5, span = 0.02 + v * 0.29;

}

// [water]
// One ray per cell. Looking down it meets the sand: low dunes, fine
// ripples, caustics sliding over them and the dolphin's soft shadow.
// Looking up it meets the underside of the waves: bright inside Snell's
// window (the circle of sky you see from under water), a dim mirror outside.
function drawWater(t) {
  const iy = 1 / (FOC * ASP), ix = 1 / FOC;
  const hgt = Math.max(0.1, D.cy - FLOOR), shx = D.cx - LX / LY * hgt, shz = D.cz - LZ / LY * hgt, blur = 0.5 + hgt * 0.35;
  for (let y = 0; y < ROWS; y++) {
    const b = -(y + 0.5 - ROWS / 2) * iy;
    for (let x = 0; x < COLS; x++) {
      const a = (x + 0.5 - COLS / 2) * ix, i = y * COLS + x;
      const dx = FX + RX * a + UX * b, dy = FY + UY * b, dz = FZ + RZ * a + UZ * b;
      nsx[i] = nsy[i] = 0; chr[i] = 0;

        const d = (FLOOR - CY) / dy, wx = CX + dx * d, wz = CZ + dz * d;
        const A = 0.9 * wx + 0.4 * Math.sin(0.7 * wz), B = 9 * wx + 2 * Math.sin(1.3 * wz), cA = Math.cos(A), cB = Math.cos(B);
        const gx = 0.072 * cA + 0.135 * cB, gz = 0.0224 * cA * Math.cos(0.7 * wz) + 0.039 * cB * Math.cos(1.3 * wz);
        const dif = (LY - gx * LX - gz * LZ) / Math.hypot(gx, 1, gz);

      } else if (dy > 1e-4) {
        const d = (SURF - CY) / dy, wx = CX + dx * d, wz = CZ + dz * d, up = dy / Math.hypot(dx, dy, dz);
        const w1 = wx * 1.7 + t * 1.1, w2 = wz * 2.3 - t * 0.9 + wx * 0.6, w3 = (wx - wz) * 4.1 + t * 1.9;
        let sp = 0.5 + 0.5 * Math.sin(w1 + Math.sin(w2) + 0.5 * Math.sin(w3)); sp = sp * sp * sp;

      } else { depth[i] = 1e9; lum[i] = 0; mat[i] = 0; glass[i] = 0; kind[i] = 0; }
    }
  }
}

// [reef]
// Boulders on the sand, tufts of seagrass that lean with the swell and
// part when the dolphin passes, a few starfish.
const rocks = [], grass = [], stars = [];
{
  const R = rng(5);
  for (let i = 0; i < 9; i++) rocks.push({ x: -6.5 + i * 1.6 + (R() - 0.5) * 0.8, z: -3.4 + R() * 4.4, r: 0.22 + R() * 0.42, f: 0.5 + R() * 0.3, seed: R() * 10 });
  for (let i = 0; i < 34; i++) {
    const k = rocks[i % rocks.length], a = R() * TAU, d = k.r + 0.1 + R() * 0.8;
    const blades = [];
    for (let j = 0; j < 5; j++) blades.push({ az: R() * TAU, len: 0.22 + R() * 0.3, lean: (R() - 0.5) * 0.5, ph: R() * TAU });
    grass.push({ x: k.x + Math.cos(a) * d, z: k.z + Math.sin(a) * d, blades });
  }
  for (let i = 0; i < 8; i++) stars.push({ x: -6 + R() * 12, z: -3 + R() * 4 });
}
function drawRocks() {
  for (const k of rocks) {
    const h = k.r * k.f;
    if (!project(k.x, FLOOR + h * 0.5, k.z)) continue;
    const ppu = FOC / PZ, nA = clamp(Math.ceil(k.r * ppu * 1.1), 5, 40), nP = clamp(Math.ceil(TAU * k.r * ppu * 1.3), 12, 160);
    for (let i = 0; i <= nA; i++) {
      const a = i / nA * Math.PI * 0.52;
      for (let j = 0; j < nP; j++) {
        const p = j / nP * TAU;
        const bump = 1 + 0.16 * Math.sin(3 * p + k.seed + 2 * a) * Math.sin(4 * a + 2 * p + k.seed) + 0.05 * Math.sin(11 * p + 7 * a);
        const rho = k.r * Math.sin(a) * bump, y = h * Math.cos(a) * bump;
        let nx = Math.cos(p) * Math.sin(a) / k.r, ny = Math.cos(a) / h, nz = Math.sin(p) * Math.sin(a) / k.r;
        const nl = Math.hypot(nx, ny, nz); nx /= nl; ny /= nl; nz /= nl;
        const x = k.x + Math.cos(p) * rho, z = k.z + Math.sin(p) * rho, yy = FLOOR - 0.04 + y;
        const f = fresnel(x, yy, z, nx, ny, nz);
        SNX = nx * RX + nz * RZ; SNY = -(nx * UX + ny * UY + nz * UZ);
        plot(x, yy, z, 0.07 + 0.55 * Math.max(0, nx * LX + ny * LY + nz * LZ) + 0.12 * f * f, 7, 0, 0, 0, SOLID);
      }

function drawGrass(t) {
  for (const g of grass) {
    const dd = Math.hypot(g.x - D.cx, FLOOR + 0.3 - D.cy, g.z - D.cz), push = dd < 1.3 ? (1.3 - dd) * 0.9 : 0;
    for (const b of g.blades) {
      let px = g.x, py = FLOOR, pz = g.z;
      const sway = b.lean + 0.32 * Math.sin(t * 1.1 + g.x * 0.7 + b.ph) + push * Math.sign(g.x - D.cx || 1);
      for (let k = 1; k <= 6; k++) {
        const s = k / 6, ang = sway * s ** 1.3, seg = b.len / 6;
        const x = px + Math.sin(ang) * seg + Math.cos(b.az) * 0.008, y = py + Math.cos(ang) * seg, z = pz + Math.sin(b.az) * 0.008;
        line(px, py, pz, x, y, z, 0.22 + 0.35 * s, 8, 0);
        px = x; py = y; pz = z;
      }
    }
  }
  for (const s of stars) plot(s.x, FLOOR + 0.01, s.z, 0.75, 12, 42, 0, 0, LINE);
}

// [school]
// Forty-eight small fish hold loose stations around a drifting centre and
// scatter when the dolphin comes through. Each is drawn the old way: ><>
const FISH = 48, fp = new Float32Array(FISH * 3), fv = new Float32Array(FISH * 3), fo = new Float32Array(FISH * 3);
{
  const R = rng(17);
  for (let i = 0; i < FISH * 3; i += 3) {
    fo[i] = (R() - 0.5) * 1.3; fo[i + 1] = (R() - 0.5) * 0.5; fo[i + 2] = (R() - 0.5) * 1.0;
    fp[i] = -1.4 + fo[i]; fp[i + 1] = -0.75 + fo[i + 1]; fp[i + 2] = -1.3 + fo[i + 2];
  }
}
function school(dt) {
  const w = 0.06, cx = -1.4 + 2.4 * Math.sin(TIME * w), cy = -0.75 + 0.3 * Math.sin(TIME * 0.13), cz = -1.3 + 0.9 * Math.cos(TIME * w);
  const vx = 2.4 * w * Math.cos(TIME * w), vz = -0.9 * w * Math.sin(TIME * w);
  for (let i = 0; i < FISH * 3; i += 3) {
    let ax = (cx + fo[i] - fp[i]) * 1.1 + (vx - fv[i]) * 0.8;
    let ay = (cy + fo[i + 1] - fp[i + 1]) * 1.1 - fv[i + 1] * 0.8;
    let az = (cz + fo[i + 2] - fp[i + 2]) * 1.1 + (vz - fv[i + 2]) * 0.8;
    const dx = fp[i] - D.cx, dy = fp[i + 1] - D.cy, dz = fp[i + 2] - D.cz, d2 = dx * dx + dy * dy + dz * dz;
    if (d2 < 2.2) { const k = (2.2 - d2) * 5 / Math.sqrt(d2 + 0.01); ax += dx * k; ay += dy * k * 0.5; az += dz * k; }
    fv[i] += ax * dt; fv[i + 1] += ay * dt; fv[i + 2] += az * dt;
    const sp = Math.hypot(fv[i], fv[i + 1], fv[i + 2]);
    if (sp > 1.8) { fv[i] *= 1.8 / sp; fv[i + 1] *= 1.8 / sp; fv[i + 2] *= 1.8 / sp; }
    fp[i] += fv[i] * dt; fp[i + 1] = clamp(fp[i + 1] + fv[i + 1] * dt, FLOOR + 0.2, SURF - 0.2); fp[i + 2] += fv[i + 2] * dt;
  }
}
function drawFish() {
  for (let i = 0; i < FISH * 3; i += 3) {
    if (!project(fp[i] - fv[i] * 0.1, fp[i + 1] - fv[i + 1] * 0.1, fp[i + 2] - fv[i + 2] * 0.1)) continue;
    const tx = PX;
    if (!project(fp[i], fp[i + 1], fp[i + 2])) continue;
    const right = PX >= tx, L = 0.5 + 0.3 * Math.sin(TIME * 3 + i);
    if (PZ > 6.5) { put(PX, PY, PZ, L, 9, right ? 62 : 60, 0, 0, LINE); continue; }
    const g = right ? [62, 60, 62] : [60, 62, 60], x0 = right ? PX - 2 : PX;
    for (let k = 0; k < 3; k++) put(x0 + k, PY, PZ, L, 9, g[k], 0, 0, LINE);
  }
}

// [bubbles]
// One pool for bubbles and spray. Bubbles rise, wobble and pop at the
// surface; spray is thrown up, falls back and is gone when it lands.
const BUB = 500, bp = new Float32Array(BUB * 3), bv = new Float32Array(BUB * 3), blife = new Float32Array(BUB), bsize = new Float32Array(BUB);
let bnext = 0;
function emit(x, y, z, vx, vy, vz, size, life) {
  const i = bnext, k = i * 3; bnext = (bnext + 1) % BUB;
  bp[k] = x; bp[k + 1] = y; bp[k + 2] = z; bv[k] = vx; bv[k + 1] = vy; bv[k + 2] = vz; bsize[i] = size; blife[i] = life;
}
function splash(x, z, power) {
  const r = Math.random;
  for (let n = 0; n < 70 * power; n++) emit(x + (r() - 0.5) * 0.3, SURF + 0.01, z + (r() - 0.5) * 0.3, (r() - 0.5) * 1.6, 1 + 2.4 * r() * power, (r() - 0.5) * 1.6, 0, 2);
  for (let n = 0; n < 60 * power; n++) emit(x + (r() - 0.5) * 0.4, SURF - 0.05 - r() * 0.6 * power, z + (r() - 0.5) * 0.4, (r() - 0.5) * 0.4, -0.3 * r(), (r() - 0.5) * 0.4, 0.15 + 0.85 * r(), 5);
}
function bubbles(dt) {
  for (let i = 0; i < BUB; i++) {
    if (blife[i] <= 0) continue;
    const k = i * 3; blife[i] -= dt;
    if (bsize[i] === 0) {
      bv[k + 1] -= 4.5 * dt;
      if (bp[k + 1] < SURF) blife[i] = 0;
    } else {
      bv[k + 1] += (0.45 + 0.4 * bsize[i] - bv[k + 1]) * dt * 2;
      bv[k] *= Math.exp(-2 * dt); bv[k + 2] *= Math.exp(-2 * dt);
      bp[k] += 0.08 * Math.sin(TIME * 6 + i) * dt;
      if (bp[k + 1] > SURF - 0.03) blife[i] = 0;
    }
    bp[k] += bv[k] * dt; bp[k + 1] += bv[k + 1] * dt; bp[k + 2] += bv[k + 2] * dt;
  }
}
function drawBubbles() {
  for (let i = 0; i < BUB; i++) {
    if (blife[i] <= 0) continue;
    const k = i * 3, s = bsize[i];
    if (s === 0) plot(bp[k], bp[k + 1], bp[k + 2], 0.75, 10, bv[k + 1] > 0 ? 39 : 46, 6, 0, LINE);
    else plot(bp[k], bp[k + 1], bp[k + 2], 0.45 + 0.4 * s, 10, s > 0.7 ? 79 : s > 0.35 ? 111 : 46, 0, 0, LINE);
  }
}

// [light]
// Sun shafts slanting down from the surface, flickering as the waves pass
// over, and marine snow. Both only ever fill open water.
const RAYS = 14, rayX = [], rayZ = [], SNOWN = REDUCED ? 60 : 150, snow = new Float32Array(SNOWN * 3);
{
  const R = rng(23);
  for (let i = 0; i < RAYS; i++) { rayX.push(-7 + i * 1.0 + R() * 0.6); rayZ.push(-2.5 + R() * 3); }
  for (let i = 0; i < SNOWN * 3; i += 3) { snow[i] = (R() - 0.5) * 12; snow[i + 1] = FLOOR + R() * (SURF - FLOOR); snow[i + 2] = -3 + R() * 4.5; }
}
function drawLight(t) {
  const dl = Math.hypot(0.22, 1, 0.12), sx = -0.22 / dl, sy = -1 / dl, sz = -0.12 / dl, len = (SURF - FLOOR) / -sy;
  for (let i = 0; i < RAYS; i++) {
    const glow = 0.5 + 0.5 * Math.sin(t * 0.37 + i * 1.9);
    if (glow < 0.2) continue;
    let x0 = rayX[i] + 0.4 * Math.sin(t * 0.05 + i);
    x0 = cam.tx + ((((x0 - cam.tx + 7) % 14) + 14) % 14) - 7;
    for (const w of [0]) {
      if (!project(x0 + w, SURF, rayZ[i])) continue;
      const ax = PX, ay = PY, az = PZ;
      if (!project(x0 + w + sx * len, FLOOR, rayZ[i] + sz * len)) continue;
      const ch = slope((PX - ax) * CW, (PY - ay) * CH), n = Math.ceil(Math.abs(PY - ay)) + 1;
      for (let s = 0; s <= n; s += 2) {
        const u = s / n;
        putBg(ax + (PX - ax) * u, ay + (PY - ay) * u, az + (PZ - az) * u, 0.13 * glow * (1 - 0.7 * u), 11, ch);
      }
    }
  }
  for (let i = 0; i < SNOWN * 3; i += 3) {
    let x = snow[i] - cam.tx; x = cam.tx + ((((x + 6) % 12) + 12) % 12) - 6;
    if (project(x, snow[i + 1], snow[i + 2])) putBg(PX, PY, PZ, 0.3, 13, 46);
  }
}
function driftSnow(dt) {
  for (let i = 0; i < SNOWN * 3; i += 3) {
    snow[i] += 0.04 * dt; snow[i + 1] -= 0.035 * dt;
    if (snow[i + 1] < FLOOR) snow[i + 1] = SURF;
  }
}

// [outline]
// A solid cell next to open water, or next to something much farther
// away, is on a silhouette. Its glyph follows the edge: the edge runs
// square to the surface normal as seen on screen. Thin sheets (fins) have
// no useful normal there, so they read the edge from their neighbours.
function solidAt(j, lim) { const k = kind[j]; return (k === SOLID || k === EDGE) && depth[j] < lim; }
function outline() {
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const i = y * COLS + x;
    if (kind[i] !== SOLID) continue;
    const lim = depth[i] + 0.25;
    const l = x > 0 && solidAt(i - 1, lim) ? 1 : 0, r = x < COLS - 1 && solidAt(i + 1, lim) ? 1 : 0;
    const u = y > 0 && solidAt(i - COLS, lim) ? 1 : 0, d = y < ROWS - 1 && solidAt(i + COLS, lim) ? 1 : 0;
    if (l && r && u && d) continue;
    let ch;
    const sx = nsx[i], sy = nsy[i];
    if (sx * sx + sy * sy > 0.12) ch = sy > 0.75 ? 95 : slope(-sy, sx);
    else {
      const gx = r - l, gy = d - u;
      if (!gx && !gy) { if (l && r) ch = 45; else if (u && d) ch = 124; else continue; }
      else if (!gy) ch = 124;
      else if (!gx) ch = gy > 0 ? 45 : 95;
      else ch = gx * gy > 0 ? 47 : 92;
    }
    chr[i] = ch; kind[i] = EDGE; lum[i] = Math.min(1, lum[i] * 1.1 + 0.06);
  }
}

// [palette]
// Every material fades dark -> mid -> bright; distance mixes it towards the
// colour of the water. Brightness picks the glyph from a density ramp.
const LV = 12, FG = 6, FOGC = [14, 48, 70];
const RAMP = '.:;-=+*o0O8%#B@', SANDR = '...,,,::;;', CEILR = '..--~~~~==';
const STOPS = [null,
  [[14, 20, 30], [72, 90, 112], [172, 192, 212]],     // 1 cape
  [[24, 32, 44], [120, 138, 158], [216, 226, 238]],   // 2 flank
  [[40, 46, 56], [192, 198, 206], [252, 252, 252]],   // 3 belly
  [[2, 4, 8], [8, 12, 18], [22, 28, 36]],             // 4 eye, mouth
  [[34, 30, 24], [150, 134, 100], [242, 226, 182]],   // 5 sand
  [[20, 62, 84], [92, 190, 212], [222, 250, 255]],    // 6 underside of the waves
  [[26, 24, 26], [98, 90, 86], [184, 172, 160]],      // 7 rock
  [[16, 36, 22], [62, 132, 72], [152, 212, 122]],     // 8 seagrass
  [[40, 50, 62], [172, 182, 194], [255, 242, 204]],   // 9 fish
  [[40, 72, 92], [152, 212, 232], [242, 252, 255]],   // 10 bubbles, spray
  [[30, 70, 92], [112, 182, 204], [204, 242, 252]],   // 11 sun shafts
  [[62, 24, 14], [222, 102, 52], [255, 192, 122]],    // 12 starfish
  [[30, 50, 64], [92, 122, 142], [172, 192, 204]]];   // 13 marine snow
const COLORS = [], GLYPH = [];
for (let m = 0; m < STOPS.length; m++) for (let l = 0; l < LV; l++) for (let f = 0; f < FG; f++) {
  if (!STOPS[m]) { COLORS.push('#000'); continue; }
  const t = (l + 0.5) / LV, A = t < 0.5 ? STOPS[m][0] : STOPS[m][1], B = t < 0.5 ? STOPS[m][1] : STOPS[m][2], u = t < 0.5 ? t * 2 : t * 2 - 1;
  const fa = f / FG * 0.85;
  COLORS.push(`rgb(${A.map((v, i) => Math.round((v + (B[i] - v) * u) * (1 - fa) + FOGC[i] * fa)).join(',')})`);
}
for (let c = 0; c < 128; c++) GLYPH.push(String.fromCharCode(c));
const counts = new Int32Array(STOPS.length * LV * FG + 1);

// [compose]
let drawn = 0;
function compose() {
  const n = COLS * ROWS;
  counts.fill(0); drawn = 0;
  for (let i = 0; i < n; i++) {
    if (!mat[i]) { bucket[i] = -1; continue; }
    const fog = 1 - Math.exp(-Math.max(0, depth[i] - cam.dist - 0.3) * 0.2), vis = lum[i] * (1 - fog * 0.8);
    if (vis < 0.035) { bucket[i] = -1; continue; }
    lum[i] = vis;
    const b = (mat[i] * LV + Math.min(LV - 1, (vis * LV) | 0)) * FG + Math.min(FG - 1, (fog * FG) | 0);
    bucket[i] = b; counts[b + 1]++; drawn++;
  }
  for (let b = 1; b < counts.length; b++) counts[b] += counts[b - 1];
  const fill = counts.slice();
  for (let i = 0; i < n; i++) if (bucket[i] >= 0) order[fill[bucket[i]]++] = i;
  tctx.setTransform(1, 0, 0, 1, 0, 0);
  tctx.clearRect(0, 0, txt.width, txt.height);
  tctx.font = Math.round(FONT * DPR) + 'px ' + MONO; tctx.textBaseline = 'top';
  for (let b = 0; b < counts.length - 1; b++) {
    if (counts[b] === counts[b + 1]) continue;
    tctx.fillStyle = COLORS[b];
    for (let o = counts[b]; o < counts[b + 1]; o++) {
      const i = order[o], L = lum[i], g = chr[i], k = kind[i];
      const s = g ? GLYPH[g] : k === GROUND ? SANDR[Math.min(9, (L * 14) | 0)] : k === CEIL ? CEILR[Math.min(9, (L * 12) | 0)] : RAMP[Math.min(14, (L * 15) | 0)];
      tctx.fillText(s, OX + (i % COLS) * CW, OY + ((i / COLS) | 0) * CH);
    }
  }
}
function present() {
  vctx.setTransform(1, 0, 0, 1, 0, 0);
  vctx.globalCompositeOperation = 'source-over'; vctx.globalAlpha = 1;
  const g = vctx.createLinearGradient(0, 0, 0, view.height);
  g.addColorStop(0, '#0b2f44'); g.addColorStop(0.5, '#061a2a'); g.addColorStop(1, '#030b14');
  vctx.fillStyle = g; vctx.fillRect(0, 0, view.width, view.height);
  bctx.clearRect(0, 0, bloom.width, bloom.height); bctx.drawImage(txt, 0, 0, bloom.width, bloom.height);
  vctx.imageSmoothingEnabled = true; vctx.globalCompositeOperation = 'lighter'; vctx.globalAlpha = 0.28;
  vctx.drawImage(bloom, 0, 0, view.width, view.height);
  vctx.globalAlpha = 1; vctx.globalCompositeOperation = 'source-over';
  vctx.drawImage(txt, 0, 0);
}

// [loop]
// Motion uses the real frame time (capped), so it is as smooth as the
// display allows; nothing is stepped on a fixed clock and then shown late.
function step(dt) { TIME += dt; swim(dt); school(dt); bubbles(dt); driftSnow(dt); }
function render(dt) {
  setCamera(dt);
  drawWater(TIME); drawRocks(); drawGrass(TIME); drawFish(); drawDolphin(); drawBubbles(); drawLight(TIME);
  outline(); compose(); present();
}
resize();
new ResizeObserver(resize).observe(stage);
if (document.fonts) document.fonts.ready.then(resize);
for (let i = 0; i < 90; i++) step(1 / 60);
cam.tx = D.cx; cam.ty = -0.2; cam.tz = D.cz * 0.5;
const hud = { spd: document.getElementById('spd'), hz: document.getElementById('hz'), dep: document.getElementById('dep'), chars: document.getElementById('chars') };
let last = performance.now(), frame = 0;
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000) * (REDUCED ? 0.6 : 1); last = now;
  if (!paused) step(dt);
  render(paused ? 0 : dt);
  if (frame++ % 6 === 0) {
    hud.spd.textContent = (D.speed * METRES).toFixed(1);
    hud.hz.textContent = (D.freq * D.amp).toFixed(1);
    hud.dep.textContent = D.cy > SURF ? 'airborne' : ((SURF - D.cy) * METRES).toFixed(1) + ' m';
    hud.chars.textContent = drawn;
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// [input]
// Drag to orbit; a tap makes the dolphin let out a stream of bubbles.
let grab = null;
stage.addEventListener('pointerdown', e => { grab = { x: e.clientX, y: e.clientY, moved: 0 }; stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove', e => {
  if (!grab) return;
  const dx = e.clientX - grab.x, dy = e.clientY - grab.y;
  grab.moved += Math.abs(dx) + Math.abs(dy); grab.x = e.clientX; grab.y = e.clientY;
  cam.dyaw -= dx * 0.005; cam.dpitch = clamp(cam.dpitch + dy * 0.003, -0.4, 0.55);
});
stage.addEventListener('pointerup', () => { if (grab && grab.moved < 6) D.exhale = 1.4; grab = null; });
stage.addEventListener('pointercancel', () => { grab = null; });
stage.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') cam.dyaw += 0.08; else if (e.key === 'ArrowRight') cam.dyaw -= 0.08;
  else if (e.key === 'ArrowUp') cam.dpitch = clamp(cam.dpitch + 0.05, -0.4, 0.55);
  else if (e.key === 'ArrowDown') cam.dpitch = clamp(cam.dpitch - 0.05, -0.4, 0.55);
  else if (e.key === ' ') D.exhale = 1.4; else return;
  e.preventDefault();
});
window.scene = { setPaused(v) { paused = v; } };
</script>

<script>
// Source panel: shows the scene script above, one section at a time.
(() => {
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const src = document.getElementById('scene').textContent.replace(/^\s*\n/, '').replace(/\s+$/, '');
  const lines = src.split('\n');
  const code = document.getElementById('code'), chips = document.getElementById('chips'), bar = document.getElementById('bar');
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const TOK = /\b(const|let|function|return|for|if|else|while|of|new|true|false|null|continue)\b|(\b\d+(?:\.\d+)?\b)/g;
  const paint = l => {
    const c = l.indexOf('//'), body = c < 0 ? l : l.slice(0, c), note = c < 0 ? '' : l.slice(c);
    return esc(body).replace(TOK, (m, k, n) => k ? `<span class="k">${k}</span>` : `<span class="n">${n}</span>`) +
      (note ? `<span class="c">${esc(note)}</span>` : '');
  };
  const rows = lines.map((l, i) => {
    const d = document.createElement('div');
    d.className = 'ln';
    d.innerHTML = `<span class="no">${i + 1}</span><span>${paint(l) || ' '}</span>`;
    code.appendChild(d);
    return d;
  });
  const secs = [];
  lines.forEach((l, i) => { const m = l.match(/^\/\/ \[([\w-]+)\]/); if (m) secs.push({ name: m[1], at: i }); });
  secs.forEach((s, i) => {
    s.end = i + 1 < secs.length ? secs[i + 1].at : lines.length;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = s.name; b.setAttribute('role', 'tab');
    b.addEventListener('click', () => show(i, true));
    chips.appendChild(b); s.btn = b;
  });
  const DWELL = 9;
  let cur = -1, since = 0, hold = 0;
  function show(i, byHand) {
    if (cur >= 0) { const o = secs[cur]; o.btn.classList.remove('on'); o.btn.setAttribute('aria-selected', 'false'); for (let r = o.at; r < o.end; r++) rows[r].classList.remove('on'); }
    cur = i; since = 0; if (byHand) hold = 25;
    const s = secs[i];
    s.btn.classList.add('on'); s.btn.setAttribute('aria-selected', 'true');
    for (let r = s.at; r < s.end; r++) rows[r].classList.add('on');
    code.scrollTo({ top: rows[s.at].offsetTop - 4, behavior: REDUCED ? 'auto' : 'smooth' });
    chips.scrollTo({ left: s.btn.offsetLeft - chips.offsetLeft - 24, behavior: REDUCED ? 'auto' : 'smooth' });
  }
  const holdOn = () => { hold = 25; };
  code.addEventListener('wheel', holdOn, { passive: true });
  code.addEventListener('touchstart', holdOn, { passive: true });
  let last = performance.now();
  (function tick(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (hold > 0) hold -= dt; else if ((since += dt) > DWELL) show((cur + 1) % secs.length);
    bar.style.width = ((cur + Math.min(1, since / DWELL)) / secs.length * 100) + '%';
    requestAnimationFrame(tick);
  })(last);
  show(Math.max(0, secs.findIndex(s => s.name === 'swimmer')));

  const panel = document.getElementById('panel'), showBtn = document.getElementById('showSrc');
  document.getElementById('hideSrc').addEventListener('click', () => { panel.hidden = true; showBtn.hidden = false; showBtn.focus(); });
  showBtn.addEventListener('click', () => { panel.hidden = false; showBtn.hidden = true; });
  showBtn.addEventListener('pointerdown', e => e.stopPropagation());
  const pauseBtn = document.getElementById('pause');
  pauseBtn.addEventListener('click', () => {
    const p = pauseBtn.textContent === 'Pause';
    window.scene.setPaused(p); pauseBtn.textContent = p ? 'Play' : 'Pause';
  });
})();
</script>
